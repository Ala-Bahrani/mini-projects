<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Novik — choose your matcha tea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10" />
    </filter>
  </svg>

  <main class="page">


    <section class="frame" id="frame">

      <!-- cards are generated by script.js -->
      <div class="stage" id="stage"></div>

      <!-- cup: real images only -->
      <div class="cup-wrap" id="cup">
        <div class="cup-photo">
          <img src="cup-original.png" alt="" draggable="false" class="cup-base" id="cupImg" />
          <span class="flavor-name" id="flavorName">Mohito</span>
        </div>
      </div>

      <div class="buy">
        <span id="price">19.33$</span>
        <!-- <button aria-label="Add to cart">🛒︎</button> -->
      </div>

      <h1 class="headline">Choose your cup</h1>

      <div class="arrows">
        <button id="prev" aria-label="Previous">←</button>
        <button id="next" aria-label="Next">→</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
